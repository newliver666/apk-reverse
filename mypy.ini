# mypy configuration for this repository.
#
# The repository is designed to check out and run its gates with only the
# standard library plus pytest (see pytest.ini and .github/workflows/ci.yml):
# frida, capstone, tiktoken and PyYAML are optional runtime dependencies that
# scripts import lazily or behind try/except, with documented fallbacks. Do not
# require them -- or their stubs -- to be installed for `mypy *.py
# skills/apk-reverse/scripts/*.py` to pass. When they *are* installed and
# typed (e.g. types-PyYAML), mypy still uses the real stubs; these overrides
# only apply where the module is missing or untyped.
#
# When installed, capstone ships no py.typed marker; frida and tiktoken are
# host-side extras. Everything else in the tree is analyzed normally.

[mypy]

[mypy-frida]
ignore_missing_imports = True

[mypy-frida.*]
ignore_missing_imports = True

[mypy-capstone]
ignore_missing_imports = True

[mypy-capstone.*]
ignore_missing_imports = True

[mypy-tiktoken]
ignore_missing_imports = True

[mypy-tiktoken.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
